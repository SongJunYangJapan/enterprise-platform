services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: enterprise_platform
      MYSQL_USER: platform
      MYSQL_PASSWORD: platform_dev
      MYSQL_ROOT_PASSWORD: root_dev
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      retries: 20
volumes:
  mysql_data:
