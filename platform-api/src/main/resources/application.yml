server:
  port: 8080
spring:
  application:
    name: platform-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/enterprise_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
mybatis:
  configuration:
    map-underscore-to-camel-case: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
